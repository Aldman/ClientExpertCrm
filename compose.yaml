services:
  crm-service:
#    image: alldman/crmservice:latest
    container_name: CRMService
    depends_on:
      - rabbit-mq
    build:
      context: .
      dockerfile: ./src/CRMService/Dockerfile
    restart: always
    ports:
      - "8080:8080"

  notification-service:
#    image: alldman/notificationservice:latest
    container_name: NotificationService
    depends_on:
      - rabbit-mq
    build:
      context: .
      dockerfile: ./src/NotificationService/Dockerfile
    restart: always
    ports:
      - "8081:8080"
  
  user-service:
#    image: alldman/userservice:latest
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings:UserServiceConnection=${USER_SERVICE_CONNECTION}
      - JwtOptions:SecretKey=${JWT_SECRET_KEY}
      - RabbitMq:User=${RABBITMQ_DEFAULT_USER}
      - RabbitMq:Password=${RABBITMQ_DEFAULT_PASS}
    container_name: UserService
    depends_on:
      - user-service-db
      - rabbit-mq
    build:
      context: .
      dockerfile: ./src/UserService/Dockerfile
    restart: always
    ports:
      - "8082:8080"
        
  api-gateway:
#    image: alldman/api-gateway:latest
    container_name: api-gateway
    depends_on:
      - crm-service
      - notification-service
      - user-service
      - user-service-db
      - crm-service-db
      - rabbit-mq
      - redis
    build:
      context: .
      dockerfile: ./src/ApiGateway/Dockerfile
    restart: always
    ports:
      - "8083:8080"
  
  rabbit-mq:
    image: rabbitmq:4.2.0-management-alpine
    container_name: RabbitMq
    restart: always
    env_file: .env
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
        
  user-service-db:
    image: postgres:18
    container_name: UserServiceDb
    env_file: .env
    environment:
      - POSTGRES_USER=${USER_SERVICE_DB_LOGIN}
      - POSTGRES_PASSWORD=${USER_SERVICE_DB_PASSWORD}
      - POSTGRES_DB=${USER_SERVICE_DB}
    restart: always
    ports:
      - "5436:5432"
    volumes:
      - UserServiceData:/var/lib/postgresql/MAJOR/docker
        
  crm-service-db:
    image: postgres:18
    container_name: CrmServiceDb
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=user123
      - POSTGRES_DB=crm-service-db
    restart: always
    ports:
      - "5437:5432"
    volumes:
      - CrmServiceData:/var/lib/postgresql/MAJOR/docker
      
  redis:
    image: redis:8.4-alpine
    container_name: redis
    ports:
      - "6379:6379"
        
volumes:
  UserServiceData:
  CrmServiceData: